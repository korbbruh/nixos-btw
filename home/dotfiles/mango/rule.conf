# ~/.config/mango/rule.conf
# Window + layer rules. Stripped to apps actually in use on this system.
# (Removed inherited rules for apps not installed: Xunlei, Baidu Netdisk, WPS,
#  QQ, WeChat, yesplaymusic, clash-verge, pot, baidunetdisk, etc.)

# ------------------------------------------------------------------
# Floating utility windows (your foot-based TUI launchers + pickers)
# ------------------------------------------------------------------
windowrule=isfloating:1,width:600,height:600,title:launcher
windowrule=isfloating:1,width:600,height:600,title:clipboard
windowrule=isfloating:1,width:1200,height:700,appid:wifi-float
windowrule=isfloating:1,width:1200,height:700,appid:bluetooth-float
windowrule=isfloating:1,width:1200,height:700,appid:wiremix-float

# ------------------------------------------------------------------
# Rofi (launcher / pickers) — float, no border, zoom anim
# ------------------------------------------------------------------
#windowrule=isfloating:1,appid:Rofi
#windowrule=isnoborder:1,appid:Rofi
windowrule=animation_type_open:slide,appid:Rofi
windowrule=animation_type_close:zoom,appid:Rofi

# ------------------------------------------------------------------
# satty (screenshot annotator) — overlay, zoom close
# ------------------------------------------------------------------
windowrule=isoverlay:1,appid:^com.gabm.satty$
windowrule=animation_type_close:zoom,appid:^com.gabm.satty$

# ------------------------------------------------------------------
# Apps that only tile cleanly when fake-maximized
# ------------------------------------------------------------------
windowrule=force_fakemaximize:1,appid:firefox
windowrule=force_fakemaximize:1,appid:org.gnome.SystemMonitor
windowrule=force_fakemaximize:1,appid:org.gnome.gThumb

# ------------------------------------------------------------------
# Tag assignments — send apps to fixed tags on open
# ------------------------------------------------------------------
windowrule=tags:4,appid:Google-chrome
windowrule=tags:2,appid:mpv
windowrule=tags:6,appid:obs

# ------------------------------------------------------------------
# Opacity overrides — force these fully opaque regardless of global
# unfocused_opacity (mpv/terminals/notes shouldn't dim)
# ------------------------------------------------------------------
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^mpv$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^foot$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^obsidian$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^Google-chrome$

# ------------------------------------------------------------------
# mpv PiP — small floating overlay in the corner
# ------------------------------------------------------------------
windowrule=isfloating:1,isoverlay:1,isnoborder:1,isunglobal:1,width:280,height:200,offsetx:9999,offsety:9999,appid:mpv,title:video0 - mpv

# ------------------------------------------------------------------
# Layer rules — selection tools, OSD, notifications, pickers
# ------------------------------------------------------------------
layerrule=noblur:1,noanim:1,layer_name:selection
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:hyprpicker
layerrule=noblur:1,noanim:1,layer_name:dimland_layer
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_type_open:fade,layer_name:swayosd
layerrule=animation_type_close:fade,layer_name:swayosd
