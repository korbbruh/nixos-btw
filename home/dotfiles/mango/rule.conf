# ~/.config/mango/rule.conf
# Window rules for apps that are actually installed.

# Firefox only tiles cleanly when fake-maximized; it lives on tag 1.
windowrule=force_fakemaximize:1,appid:firefox
windowrule=tags:1,appid:firefox

# Opacity overrides: terminal slightly translucent, notes never dimmed.
windowrule=unfocused_opacity:0.94,focused_opacity:0.985,appid:^foot$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^obsidian$
