# ~/.config/mango/rule.conf
# Window rules for apps that are actually installed.

# Firefox only tiles cleanly when fake-maximized; it lives on tag 1.
window_rule=force_fake_maximize:1,app_id:firefox
window_rule=tags:1,app_id:firefox

# Opacity overrides: terminal slightly translucent, notes never dimmed.
window_rule=unfocused_opacity:0.94,focused_opacity:0.985,app_id:^foot$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^obsidian$
