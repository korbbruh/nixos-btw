# ~/.config/mango/rule.conf
# Window + layer rules. Stripped to apps actually in use on this system.
# (Removed inherited rules for apps not installed: Xunlei, Baidu Netdisk, WPS,
#  QQ, WeChat, yesplaymusic, clash-verge, pot, baidunetdisk, etc.)

# ------------------------------------------------------------------
# Floating utility windows (your foot-based TUI launchers + pickers)
# ------------------------------------------------------------------
window_rule=is_floating:1,width:600,height:600,title:launcher
window_rule=is_floating:1,width:600,height:600,title:clipboard
window_rule=is_floating:1,width:1200,height:700,app_id:wifi-float
window_rule=is_floating:1,width:1200,height:700,app_id:bluetooth-float
window_rule=is_floating:1,width:1200,height:700,app_id:wiremix-float

# ------------------------------------------------------------------
# Rofi (launcher / pickers) — float, no border, zoom anim
# ------------------------------------------------------------------
#windowrule=is_floating:1,app_id:Rofi
#windowrule=no_border:1,app_id:Rofi
window_rule=animation_type_open:slide,app_id:Rofi
window_rule=animation_type_close:zoom,app_id:Rofi

# ------------------------------------------------------------------
# satty (screenshot annotator) — overlay, zoom close
# ------------------------------------------------------------------
window_rule=is_overlay:1,app_id:^com.gabm.satty$
window_rule=animation_type_close:zoom,app_id:^com.gabm.satty$

# ------------------------------------------------------------------
# Apps that only tile cleanly when fake-maximized
# ------------------------------------------------------------------
window_rule=force_fake_maximize:1,app_id:firefox
window_rule=force_fake_maximize:1,app_id:org.gnome.SystemMonitor
window_rule=force_fake_maximize:1,app_id:org.gnome.gThumb

# ------------------------------------------------------------------
# Tag assignments — send apps to fixed tags on open
# ------------------------------------------------------------------
window_rule=tags:4,app_id:Google-chrome
window_rule=tags:2,app_id:mpv
window_rule=tags:6,app_id:obs

# ------------------------------------------------------------------
# Opacity overrides — force these fully opaque regardless of global
# unfocused_opacity (mpv/terminals/notes shouldn't dim)
# ------------------------------------------------------------------
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^mpv$
window_rule=unfocused_opacity:0.94,focused_opacity:0.985,app_id:^foot$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^obsidian$
window_rule=unfocused_opacity:1.0,focused_opacity:1.0,app_id:^Google-chrome$

# ------------------------------------------------------------------
# mpv PiP — small floating overlay in the corner
# ------------------------------------------------------------------
window_rule=is_floating:1,is_overlay:1,no_border:1,is_unmanaged_global:1,width:280,height:200,offset_x:9999,offset_y:9999,app_id:mpv,title:video0 - mpv

# ------------------------------------------------------------------
# Layer rules — selection tools, OSD, notifications, pickers
# ------------------------------------------------------------------
layer_rule=no_blur:1,no_animation:1,layer_name:selection
layer_rule=no_animation:1,no_blur:1,no_shadow:1,layer_name:hyprpicker
layer_rule=no_blur:1,no_animation:1,layer_name:dimland_layer
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
layer_rule=animation_type_open:fade,layer_name:swayosd
layer_rule=animation_type_close:fade,layer_name:swayosd
