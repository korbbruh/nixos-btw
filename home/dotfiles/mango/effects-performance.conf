# ~/.config/mango/effects-performance.conf
# PERFORMANCE preset — effects off for battery / gaming / heat.
# Blur and shadows are the expensive compositor work; killing them is the win.
# Animations dropped too (cheap individually, but reduces GPU wakeups).

# Effect
blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=5

# Animations off
animations=0
layer_animations=0
animation_fade_in=0
animation_fade_out=0
