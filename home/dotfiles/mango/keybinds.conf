# ~/.config/mango/keybinds.conf
# Complete bind set: dwm-style layout letters + all utility binds.
# Sourced from config.conf via:  source=~/.config/mango/keybinds.conf
# Reload after editing:  SUPER+SHIFT+R   (mmsg dispatch reload_config)

# =================================================================
# LAUNCHERS / SYSTEM
# =================================================================
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn, rofi -show drun -theme ~/.config/rofi/kev.rasi
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,r,reload_config
bind=SUPER,r,spawn,~/.config/mango/waybar-reload.sh
bind=SUPER+SHIFT,m,quit
bind=SUPER,e,spawn,thunar
bind=SUPER,w,spawn, app.zen_browser.zen
bind=Ctrl+Alt,Delete,spawn,~/.config/mango/bin/powermenu.sh
bind=SUPER+CTRL+ALT,b,spawn,sh -c 'notify-send -u low "$(~/.config/mango/bin/battery-status)"'
# utilities
#bind=SUPER,v,spawn,foot --title clipboard fsel --cclip
bind=SUPER,v,spawn,~/.config/mango/clipboard.sh
bind=SUPER,period,spawn,~/.config/mango/emoji.sh
bind=SUPER+SHIFT,w,spawn,~/.config/mango/wallpaper.sh
bind=SUPER+SHIFT,p,spawn,~/.config/mango/theme-pick.sh
bind=SUPER+SHIFT,s,spawn,~/.config/mango/screenshot.sh freeze-region
bind=SUPER,0,toggleoverview

bind=NONE,XF86Launch3,spawn,asusctl aura effect --next-mode
bind=NONE,XF86Launch4,spawn,rog-control-center

# =================================================================
# VOLUME / BRIGHTNESS  (bindl = works while locked)
# =================================================================
bindl=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bindl=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bindl=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bindl=NONE,XF86AudioMicMute,spawn,~/.config/mango/bin/micmute.sh
bindl=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bindl=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower
#bindl=NONE,XF86KbdBrightnessDown,spawn,brightnessctl -d asus::kbd_backlight set 1-
#bindl=NONE,XF86KbdBrightnessUp,spawn,brightnessctl -d asus::kbd_backlight set +1

# =================================================================
# SYSTEM TOGGLES
# =================================================================
bind=SUPER+CTRL,i,spawn,~/.config/mango/bin/caffeine.sh
bind=SUPER+CTRL,comma,spawn,~/.config/mango/bin/dnd.sh
bind=SUPER+CTRL,n,spawn,~/.config/mango/bin/nightlight.sh
bindl=SUPER,l,spawn,swaylock

# =================================================================
# FOCUS (hjkl)
# =================================================================
bind=SUPER,left,focusdir,left
bind=SUPER,down,focusdir,down
bind=SUPER,up,focusdir,up
bind=SUPER,right,focusdir,right
bind=SUPER,Tab,focusstack,next

# =================================================================
# MOVE / SWAP WINDOW (SHIFT+hjkl)
# =================================================================
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,down,exchange_client,down
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,right,exchange_client,right

# =================================================================
# RESIZE (CTRL+hjkl)
# =================================================================
bind=SUPER+CTRL,left,resizewin,-50,+0
bind=SUPER+CTRL,down,resizewin,+0,+50
bind=SUPER+CTRL,up,resizewin,+0,-50
bind=SUPER+CTRL,right,resizewin,+50,+0

# =================================================================
# NUDGE FLOATING (ALT+hjkl)
# =================================================================
bind=SUPER+ALT,left,movewin,-50,+0
bind=SUPER+ALT,down,movewin,+0,+50
bind=SUPER+ALT,up,movewin,+0,-50
bind=SUPER+ALT,right,movewin,+50,+0

# =================================================================
# LAYOUTS (dwm-style mnemonic letters)
# =================================================================
bind=SUPER,t,setlayout,tile
bind=SUPER,c,setlayout,dwindle
bind=SUPER,x,setlayout,scroller
bind=SUPER,b,setlayout,vertical_tile
bind=SUPER,n,switch_layout
bind=SUPER,i,incnmaster,1
bind=SUPER,p,incnmaster,-1
#bind=SUPER,e,set_proportion,1.0

# =================================================================
# WINDOW STATE
# (note: float on g, fullscreen on f, since t/c/x/v are taken)
# =================================================================
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER+ALT,space,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,m,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,grave,toggleoverview,
bind=SUPER,y,toggleglobal,

# =================================================================
# TAGS (1-9)
# =================================================================
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,bracketleft,viewtoleft_have_client,0
bind=SUPER,bracketright,viewtoright_have_client,0

# =================================================================
# GAPS
# =================================================================
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps

# =================================================================
# MONITORS (SUPER+ALT, off hjkl to avoid clobbering nudge)
# =================================================================
bind=SUPER+ALT,bracketleft,focusmon,left
bind=SUPER+ALT,bracketright,focusmon,right
bind=SUPER+ALT,comma,tagmon,left
bind=SUPER+ALT,period,tagmon,right

# =================================================================
# MOUSE
# =================================================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# =================================================================
# AXIS (super+scroll to change tag)
# =================================================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

bind=SUPER+CTRL,g,spawn,~/.config/mango/bin/effects.sh
