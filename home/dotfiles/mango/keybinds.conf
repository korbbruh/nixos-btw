# ~/.config/mango/keybinds.conf
# dwm-style layout letters + system binds. Shell actions go through Noctalia's
# IPC (`noctalia msg ...`; full list: `noctalia msg --help`).
# Sourced from config.conf. Reload after editing: SUPER+SHIFT+R

# =================================================================
# LAUNCHERS / APPS
# =================================================================
bind=SUPER,Return,spawn,foot
bind=SUPER,e,spawn,thunar
bind=SUPER,w,spawn,firefox

# =================================================================
# NOCTALIA (panels, session, toggles)
# =================================================================
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,period,spawn,noctalia msg panel-toggle launcher /emo
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=Ctrl+Alt,Delete,spawn,noctalia msg panel-toggle session
bind=SUPER+CTRL,i,spawn,noctalia msg caffeine-toggle
bind=SUPER+CTRL,comma,spawn,noctalia msg notification-dnd-toggle
bind=SUPER+CTRL,n,spawn,noctalia msg nightlight-force-toggle
bindl=SUPER,l,spawn,noctalia msg session lock

# =================================================================
# MEDIA KEYS  (bindl = also works on the lock screen)
# =================================================================
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# G15 hardware keys (do nothing on Terra)
bind=NONE,XF86Launch3,spawn,asusctl aura effect --next-mode
bind=NONE,XF86Launch4,spawn,rog-control-center

# =================================================================
# SCREENSHOTS
# =================================================================
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region

# =================================================================
# COMPOSITOR
# =================================================================
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,m,quit
bind=SUPER,0,toggleoverview
bind=SUPER,grave,toggleoverview,

# =================================================================
# FOCUS
# =================================================================
bind=ALT,Tab,togglejump
bind=SUPER,left,focusdir,left
bind=SUPER,down,focusdir,down
bind=SUPER,up,focusdir,up
bind=SUPER,right,focusdir,right
bind=SUPER,Tab,focusstack,next

# =================================================================
# MOVE / SWAP WINDOW
# =================================================================
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,down,exchange_client,down
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,right,exchange_client,right

# =================================================================
# RESIZE
# =================================================================
bind=SUPER+CTRL,left,resizewin,-50,+0
bind=SUPER+CTRL,down,resizewin,+0,+50
bind=SUPER+CTRL,up,resizewin,+0,-50
bind=SUPER+CTRL,right,resizewin,+50,+0

# =================================================================
# NUDGE FLOATING
# =================================================================
bind=SUPER+ALT,left,movewin,-50,+0
bind=SUPER+ALT,down,movewin,+0,+50
bind=SUPER+ALT,up,movewin,+0,-50
bind=SUPER+ALT,right,movewin,+50,+0

# =================================================================
# LAYOUTS (dwm-style mnemonic letters)
# =================================================================
bind=SUPER,t,setlayout,tile
bind=SUPER,c,setlayout,dwindle
bind=SUPER,x,setlayout,scroller
bind=SUPER,b,setlayout,vertical_tile
bind=SUPER,n,switch_layout
bind=SUPER,i,incnmaster,1
bind=SUPER,p,incnmaster,-1

# =================================================================
# WINDOW STATE
# =================================================================
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER+ALT,space,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,m,minimized,
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad
bind=SUPER,y,toggleglobal,

# =================================================================
# TAGS (1-9)
# =================================================================
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,bracketleft,viewtoleft_have_client,0
bind=SUPER,bracketright,viewtoright_have_client,0

# =================================================================
# GAPS
# =================================================================
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,g,togglegaps

# =================================================================
# MONITORS
# =================================================================
bind=SUPER+ALT,bracketleft,focusmon,left
bind=SUPER+ALT,bracketright,focusmon,right
bind=SUPER+ALT,comma,tagmon,left
bind=SUPER+ALT,period,tagmon,right

# =================================================================
# MOUSE / SCROLL
# =================================================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

