# ~/.config/mango/effects-full.conf
# FULL effects preset — your normal look. Blur, shadows, animations on.
# Applied by effects.sh; do not edit the live effects.conf directly, edit this.

# Effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

border_radius=5

# Animations
animations=1
layer_animations=1
animation_fade_in=1
animation_fade_out=1
